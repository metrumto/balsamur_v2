name: Build BalsaMur APK

on:
  push:
    branches: [ apk-balsamur ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/metrumto/balsamur android/app/src/main/assets android/app/src/main/res/drawable android/app/src/main/res/values
          cp index.html app.js manifest.webmanifest sw.js sw-register.js android/app/src/main/assets/
          curl -fsSL https://raw.githubusercontent.com/metrumto/balsamur_v2/main/icon-512.png -o android/app/src/main/res/drawable/icon.png
          curl -fsSL https://raw.githubusercontent.com/metrumto/balsamur_v2/main/icon-192.png -o android/app/src/main/res/drawable/footer_icon.png
          cat > android/settings.gradle <<'EOF'
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name='BalsaMur'
include ':app'
EOF
          cat > android/build.gradle <<'EOF'
plugins { id 'com.android.application' version '8.6.1' apply false }
EOF
          cat > android/app/build.gradle <<'EOF'
plugins { id 'com.android.application' }
android { namespace 'com.metrumto.balsamur'; compileSdk 35
    defaultConfig { applicationId 'com.metrumto.balsamur'; minSdk 23; targetSdk 35; versionCode 4; versionName '4.0' }
}
EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <application android:theme="@style/AppTheme" android:label="BalsaMur" android:icon="@drawable/icon" android:usesCleartextTraffic="false">
        <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:exported="true">
            <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
        </activity>
    </application>
</manifest>
EOF
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
<resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#1565C0</item><item name="android:navigationBarColor">#000000</item><item name="android:windowLightStatusBar">true</item><item name="android:statusBarColor">#FFFFFF</item></style></resources>
EOF
          cat > android/app/src/main/java/com/metrumto/balsamur/MainActivity.java <<'EOF'
package com.metrumto.balsamur;
import android.app.*; import android.content.*; import android.os.*; import android.provider.Settings; import android.text.InputType; import android.view.*; import android.webkit.*; import android.widget.*; import org.json.JSONObject; import java.io.*; import java.net.*; import java.nio.charset.StandardCharsets; import java.util.concurrent.*;
public class MainActivity extends Activity {
  private static final String URL="https://balsamur-activation.onrender.com/activate", PREF="balsamur_activation", KEY="activated";
  private final ExecutorService executor=Executors.newSingleThreadExecutor();
  public void onCreate(Bundle b){super.onCreate(b); if(getSharedPreferences(PREF,0).getBoolean(KEY,false)) showApp(); else showActivation();}
  private int dp(int n){return (int)(n*getResources().getDisplayMetrics().density+.5f);}
  private void showApp(){LinearLayout root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); WebView web=new WebView(this); web.setWebViewClient(new WebViewClient()); WebSettings s=web.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); web.loadUrl("file:///android_asset/index.html"); root.addView(web,new LinearLayout.LayoutParams(-1,0,1)); ImageView footer=new ImageView(this); footer.setImageResource(R.drawable.footer_icon); footer.setScaleType(ImageView.ScaleType.FIT_CENTER); footer.setPadding(dp(8),dp(4),dp(8),dp(4)); root.addView(footer,new LinearLayout.LayoutParams(-1,dp(72))); setContentView(root);}
  private void showActivation(){LinearLayout box=new LinearLayout(this); box.setOrientation(LinearLayout.VERTICAL); int p=dp(24); box.setPadding(p,0,p,0); TextView info=new TextView(this); info.setText("Introduce el código de activación de BalsaMur."); EditText input=new EditText(this); input.setHint("Código de 12 caracteres"); input.setSingleLine(true); input.setInputType(InputType.TYPE_CLASS_TEXT|InputType.TYPE_TEXT_FLAG_CAP_CHARACTERS); box.addView(info,new LinearLayout.LayoutParams(-1,-2)); box.addView(input,new LinearLayout.LayoutParams(-1,-2)); AlertDialog d=new AlertDialog.Builder(this).setTitle("Activar BalsaMur").setView(box).setCancelable(false).setNegativeButton("Salir",(x,w)->finish()).setPositiveButton("Activar",null).create(); d.setOnShowListener(x->d.getButton(-1).setOnClickListener(v->{String code=input.getText().toString().trim().toUpperCase(); if(!code.matches("[A-Z0-9]{12}")){input.setError("El código debe tener exactamente 12 caracteres alfanuméricos");return;} d.getButton(-1).setEnabled(false); activate(code,d); })); d.show();}
  private void activate(String code,AlertDialog dialog){executor.execute(()->{int status=-1; String body=""; try{String device=Settings.Secure.getString(getContentResolver(),Settings.Secure.ANDROID_ID); JSONObject p=new JSONObject();p.put("code",code);p.put("deviceId",device==null?"unknown-device":device); HttpURLConnection c=(HttpURLConnection)new URL(URL).openConnection();c.setRequestMethod("POST");c.setConnectTimeout(15000);c.setReadTimeout(15000);c.setRequestProperty("Content-Type","application/json; charset=UTF-8");c.setDoOutput(true);try(OutputStream o=c.getOutputStream()){o.write(p.toString().getBytes(StandardCharsets.UTF_8));}status=c.getResponseCode();InputStream in=status>=400?c.getErrorStream():c.getInputStream();if(in!=null){try(BufferedReader r=new BufferedReader(new InputStreamReader(in,StandardCharsets.UTF_8))){String l;StringBuilder z=new StringBuilder();while((l=r.readLine())!=null)z.append(l);body=z.toString();}}c.disconnect();}catch(Exception e){body=e.getMessage()==null?"network_error":e.getMessage();} final int st=status;final String res=body;runOnUiThread(()->{if(st==200&&res.contains("\"ok\":true")){getSharedPreferences(PREF,0).edit().putBoolean(KEY,true).apply();dialog.dismiss();showApp();}else{String m=st==409?"Este código ya está asociado a otro dispositivo.":st==403?"Código no válido.":"No se ha podido conectar con el servidor de activación.";Toast.makeText(this,m,Toast.LENGTH_LONG).show();dialog.getButton(-1).setEnabled(true);}});});}
  protected void onDestroy(){executor.shutdownNow();super.onDestroy();}
}
EOF
          cd android && gradle wrapper --gradle-version 8.7
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BalsaMur-APK-v4
          path: android/app/build/outputs/apk/debug/app-debug.apk
